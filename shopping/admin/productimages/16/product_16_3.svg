  <text x="50" y="70" font-family="'Space Mono', monospace" font-size="12" fill="#7dd3fc" letter-spacing="2">ZEYTECH LOGISTICS // CASABLANCA HUB-A1</text>
  <text x="750" y="70" text-anchor="end" font-family="'Space Mono', monospace" font-size="12" fill="#8ea2bf">SKU: RN13PP-512-MIDNIGHT</text>

  <!-- Hexagram Brand Structural Mark -->
  <g transform="translate(400, 370)">
